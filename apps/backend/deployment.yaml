apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: production

spec:
  replicas: 10

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      serviceAccountName: backend-sa

      containers:
        - name: backend
          image: rahamshaik/zomato_new:0436748936d87c8d775163a1eeb1f8ba0d1d548e

          ports:
            - containerPort: 3001

          resources:
            requests:
              cpu: "2000m"
              memory: "2Gi"
            limits:
              cpu: "500m"
              memory: "1Gi"
